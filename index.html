<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18岁的光影与文字</title>
    <style>
        /* 基础设置 */
        body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; margin: 0; padding: 0; background-color: #fafafa; color: #333; line-height: 1.6; }
        a { text-decoration: none; color: #0066cc; }
        
        /* 顶部导航 */
        header { text-align: center; padding: 40px 20px; background: #fff; border-bottom: 1px solid #eee; }
        header h1 { margin: 0; font-size: 2rem; letter-spacing: 2px; font-weight: 600; }
        header p { color: #888; margin-top: 10px; font-size: 1rem; }

        /* 容器 */
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }

        /* 模块标题 */
        .section-title { font-size: 1.4rem; border-left: 4px solid #0066cc; padding-left: 10px; margin-bottom: 20px; font-weight: bold; }

        /* 作品墙 */
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .gallery-item { background: #e0e0e0; height: 200px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #888; transition: transform 0.3s; }
        .gallery-item:hover { transform: scale(1.02); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }

        /* 文章列表 */
        .blog-list { list-style: none; padding: 0; }
        .blog-list li { background: #fff; padding: 15px 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .blog-date { color: #aaa; font-size: 0.9rem; }

        /* 页脚 */
        footer { text-align: center; padding: 40px 20px; color: #aaa; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h1>18岁 · 拾光记</h1>
        <p>用镜头记录日常，用文字讲述故事</p>
    </header>

    <div class="container">
        <!-- 关于我 -->
        <div class="section-title">关于我</div>
        <p>你好！我是一个热爱生活、喜欢折腾的高中生。目前正在攒钱买一台趁手的相机（还在纠结买哪款），准备去拍日常的街道、天上的云和身边的碎碎念。这里是我的小天地。</p>

        <!-- 摄影作品 -->
        <div class="section-title" style="margin-top: 40px;">光影集 (未来会放我的相机作品)</div>
        <div class="gallery">
            <div class="gallery-item">日常 Vlog 封面占位</div>
            <div class="gallery-item">校园天空占位</div>
            <div class="gallery-item">航拍视角占位</div>
        </div>

        <!-- 记叙文 / 随笔 -->
        <div class="section-title" style="margin-top: 40px;">记叙文与碎碎念</div>
        <ul class="blog-list">
            <li>
                <a href="#">高考作文练习：那个夏天的蝉鸣</a>
                <span class="blog-date">2026-05-12</span>
            </li>
            <li>
                <a href="#">随笔：为什么我不想按套路写议论文</a>
                <span class="blog-date">2026-04-20</span>
            </li>
            <li>
                <a href="#">攒钱日记：距离我的第一台相机还有多远？</a>
                <span class="blog-date">2026-03-01</span>
            </li>
        </ul>
    </div>

    <footer>
        &copy; 2026 我的个人主页. Made with ❤️.
    </footer>

</body>
</html>
