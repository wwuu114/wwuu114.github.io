<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的厦门之旅</title>
    <style>
        :root {
            --bg-color: #050505; --text-main: #ffffff; --text-muted: #8b8b99;
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #9d4edd 100%);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }

        nav { position: fixed; top: 0; width: 100%; background: rgba(5, 5, 5, 0.7); backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border); z-index: 1000; padding: 20px 0; text-align: center; }
        nav a { font-size: 1rem; color: var(--text-muted); transition: 0.3s; }
        nav a:hover { color: #fff; text-shadow: 0 0 10px #00f2fe; }

        .header { padding: 150px 20px 50px; text-align: center; }
        .header h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; letter-spacing: 2px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: var(--text-muted); margin-top: 15px; letter-spacing: 1px; }

        .gallery-container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

        .media-card { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); border-radius: 16px; overflow: hidden; transition: transform 0.4s, box-shadow 0.4s; display: flex; flex-direction: column; }
        .media-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0, 242, 254, 0.15); border-color: rgba(0, 242, 254, 0.3); }
        .media-card img, .media-card video { width: 100%; height: 100%; object-fit: cover; display: block; background: #000; }

        /* 加载中的提示 */
        .loading-text { text-align: center; color: var(--text-muted); font-size: 1.2rem; grid-column: 1 / -1; padding: 50px 0; }

        footer { text-align: center; padding: 40px; color: var(--text-muted); font-size: 0.9rem; margin-top: 50px; }
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s ease; }
        .reveal.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <nav><a href="index.html">← 返回主页</a></nav>
    <div class="header reveal">
        <h1>我的厦门之旅</h1>
        <p>记录阴雨、海浪与街道</p>
    </div>

    <!-- 这里是空的，等着魔法脚本把文件填进去 -->
    <div class="gallery-container" id="gallery">
        <div class="loading-text">正在从文件夹中读取照片和视频...</div>
    </div>

    <footer>© 2026 厦门之旅纪念</footer>

    <script>
        const container = document.getElementById('gallery');
        
        // 【魔法核心】：读取你 GitHub 仓库 xiamen 文件夹里的所有文件
        // 注意：这里的 wwuu114 是你的用户名，如果你改了名字，这里也要改
        const apiUrl = 'https://api.github.com/repos/wwuu114/wwuu114.github.io/contents/xiamen';

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                // 清空“加载中”提示
                container.innerHTML = '';
                
                // 如果没有读取到文件
                if (!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = '<div class="loading-text">文件夹里还是空的哦，快传点照片和视频吧！</div>';
                    return;
                }

                let hasMedia = false;

                // 遍历读取到的每一个文件
                data.forEach(file => {
                    const fileName = file.name.toLowerCase();
                    
                    // 如果是图片
                    if (fileName.endsWith('.jpg') || fileName.endsWith('.jpeg') || fileName.endsWith('.png') || fileName.endsWith('.webp')) {
                        hasMedia = true;
                        container.innerHTML += `<div class="media-card reveal"><img src="${file.download_url}" loading="lazy"></div>`;
                    }
                    // 如果是视频
                    else if (fileName.endsWith('.mp4') || fileName.endsWith('.mov')) {
                        hasMedia = true;
                        container.innerHTML += `<div class="media-card reveal"><video src="${file.download_url}" controls playsinline></video></div>`;
                    }
                });

                if (!hasMedia) {
                    container.innerHTML = '<div class="loading-text">文件夹里没有找到支持的照片或视频。</div>';
                }

                // 触发滚动淡入动画
                initReveal();
            })
            .catch(error => {
                container.innerHTML = '<div class="loading-text">读取失败啦，可能是网络问题，刷新重试一下~</div>';
            });

        // 滚动淡入动画
        function initReveal() {
            const revealElements = document.querySelectorAll('.reveal');
            const revealObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });
            revealElements.forEach(el => revealObserver.observe(el));
        }

        // 背景特效不变
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        class Particle {
            constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.4; this.vy = (Math.random() - 0.5) * 0.4; this.radius = Math.random() * 1.5 + 0.5; }
            update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
            draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0, 242, 254, 0.4)'; ctx.fill(); }
        }
        for (let i = 0; i < 50; i++) particles.push(new Particle());
        function animate() {
            requestAnimationFrame(animate); ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(); particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x; const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) { ctx.beginPath(); ctx.strokeStyle = `rgba(0, 242, 254, ${0.15 - dist/800})`; ctx.lineWidth = 0.5; ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                }
            }
        }
        animate();
    </script>
</body>
</html>
